[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdmclient"
version = "0.1.0"
description = "Client for downloading articles from Wiley's TDM API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]